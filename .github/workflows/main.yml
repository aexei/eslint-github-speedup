name: Test-And-Analyze

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get changed files
        id: file_changes
        uses: tj-actions/changed-files@v38
        with:
          files: |
            **.css
            **.html
            **.ts

      - name: Print info
        run: |
            INPUT_STRING="${{ github.event.inputs.files_string }}"
            OUTPUT=""
            
            for FILE in $INPUT_STRING; do
              OUTPUT="$OUTPUT --lint-file-patterns $FILE"
            done

            OUTPUT="${OUTPUT# }"
            echo "args=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
      
      - name: Lint
        run: npm run lint
      
      - name: Test
        run: npm run test:ci
